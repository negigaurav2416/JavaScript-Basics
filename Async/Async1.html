<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async project</title>
</head>
<body>
    <h1>Chai Aur Code</h1>
    <button id="stop">Submit/Stop</button>
    <script>
        const x = function(){
            console.log("Gaurav Negi");
        }
        const changeMe = function(){
            document.querySelector('h1').innerHTML = "Take You Forward";
        }
        const change = setTimeout(changeMe, 2000);
        document.querySelector('#stop').addEventListener('click', function(){
            clearTimeout(change);
        })
    </script>
</body>
</html>
